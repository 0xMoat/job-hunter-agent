name: Deploy

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      force:
        description: 'Force deploy even if paths did not change'
        type: boolean
        default: true

jobs:
  # ── Detect what changed ──────────────────────────────────────────────
  changes:
    name: Detect changes
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'app/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'Dockerfile'
              - 'docker-compose.prod.yml'
              - 'prometheus/**'
              - 'grafana/**'
              - 'caddy/**'
            frontend:
              - 'frontend/**'

  # ── Backend: SSH deploy to Oracle server ─────────────────────────────
  deploy-backend:
    name: Deploy Backend
    needs: changes
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.force == true) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && needs.changes.outputs.backend == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /home/ubuntu/apps/job-hunter-agent

            # ── Capture pre-pull SHA so we can diff which subsystems changed ──
            OLD_SHA=$(git rev-parse HEAD)
            git fetch origin master
            NEW_SHA=$(git rev-parse FETCH_HEAD)
            git checkout -f FETCH_HEAD

            if [ "$OLD_SHA" = "$NEW_SHA" ]; then
              CHANGED="(forced — no git delta)"
            else
              CHANGED=$(git diff --name-only "$OLD_SHA" "$NEW_SHA")
            fi
            echo "── Files changed since last deploy ──"
            echo "$CHANGED"
            echo "──────────────────────────────────────"

            # Helper: returns 0 if any path in CHANGED starts with given prefix.
            changed_under() {
              echo "$CHANGED" | grep -Eq "^$1" && return 0 || return 1
            }

            # ── App services: rebuild only when code / infra / deps changed ──
            if changed_under "app/|scripts/|pyproject\.toml|uv\.lock|Dockerfile|docker-compose\.prod\.yml" \
               || [ "$OLD_SHA" = "$NEW_SHA" ]; then
              # Drain: wait up to 60s for any in-flight Plan-Execute SSE
              # streams to finish so the container restart doesn't orphan
              # them mid-step. Timeout-bounded so a stuck run can't block
              # deploys indefinitely.
              echo "→ draining in-flight Plan-Execute runs"
              for i in $(seq 1 12); do
                count=$(curl -sf --max-time 3 \
                  http://localhost:8000/api/v1/chatbot/plan-execute/inflight \
                  2>/dev/null | python3 -c \
                  'import json,sys; print(json.load(sys.stdin).get("count",0))' \
                  2>/dev/null || echo 0)
                if [ "$count" = "0" ]; then
                  echo "  drain: no in-flight runs"
                  break
                fi
                echo "  drain: $count in-flight run(s), waiting 5s (attempt $i/12)"
                sleep 5
              done

              # Preserve the currently-running image under its SHA so the
              # rebuild about to overwrite :latest doesn't orphan it.
              # Result: old image keeps a name (sha-<7-char>) instead of
              # becoming a <none>:<none> dangling layer.
              OLD_SHORT=${OLD_SHA:0:7}
              if docker image inspect job-hunter-agent-app:latest >/dev/null 2>&1; then
                docker tag job-hunter-agent-app:latest "job-hunter-agent-app:sha-$OLD_SHORT" || true
              fi

              echo "→ rebuilding app container"
              docker compose -f docker-compose.prod.yml up -d --build app

              # Stamp the fresh build with its git SHA for audit / rollback lookup.
              NEW_SHORT=${NEW_SHA:0:7}
              docker tag job-hunter-agent-app:latest "job-hunter-agent-app:sha-$NEW_SHORT"
              echo "→ tagged new image as job-hunter-agent-app:sha-$NEW_SHORT"
            else
              echo "→ app unchanged, skipping rebuild"
            fi

            # ── Prometheus config ─────────────────────────────────────────
            if changed_under "prometheus/"; then
              echo "→ prometheus config changed — restarting"
              docker compose -f docker-compose.prod.yml restart prometheus
            fi

            # ── Grafana dashboards / datasources ──────────────────────────
            if changed_under "grafana/"; then
              echo "→ grafana config changed — restarting"
              docker compose -f docker-compose.prod.yml restart grafana
            fi

            # ── Caddy site configs ────────────────────────────────────────
            if changed_under "caddy/"; then
              echo "→ caddy config changed — syncing and reloading"
              sudo cp caddy/sites/*.conf /etc/caddy/sites/
              sudo systemctl reload caddy
            fi

            # Bring up anything that happens to be stopped (safety net).
            docker compose -f docker-compose.prod.yml up -d

            echo "Waiting for backend health check..."
            sleep 15
            curl -sf http://localhost:8000/health
            echo "Backend deployed successfully"

  # ── Frontend: Deploy to Vercel ───────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend
    needs: changes
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.force == true) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && needs.changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Vercel CLI
        run: npm i -g vercel@latest
      - name: Pull Vercel environment
        working-directory: frontend
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build
        working-directory: frontend
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        working-directory: frontend
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
