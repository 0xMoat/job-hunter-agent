name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      force:
        description: 'Force deploy even if paths did not change'
        type: boolean
        default: true

jobs:
  # ── Detect what changed ──────────────────────────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'app/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'Dockerfile'
              - 'docker-compose.prod.yml'
              - 'prometheus/**'
              - 'grafana/**'
              - 'caddy/**'
            frontend:
              - 'frontend/**'

  # ── Backend: SSH deploy to Oracle server ─────────────────────────────
  deploy-backend:
    name: Deploy Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true' || inputs.force == true
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/ubuntu/apps/job-hunter-agent
            git fetch origin master
            git checkout -f FETCH_HEAD
            docker compose -f docker-compose.prod.yml up -d --build
            # Sync Caddy site configs and restart
            sudo cp caddy/sites/*.conf /etc/caddy/sites/
            sudo systemctl restart caddy
            echo "Waiting for health check..."
            sleep 15
            curl -sf http://localhost:8000/health || exit 1
            echo "Backend deployed successfully"

  # ── Frontend: Deploy to Vercel ───────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || inputs.force == true
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Vercel CLI
        run: npm i -g vercel@latest
      - name: Pull Vercel environment
        working-directory: frontend
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build
        working-directory: frontend
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        working-directory: frontend
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
