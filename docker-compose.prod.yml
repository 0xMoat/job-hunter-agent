services:
  app:
    build:
      context: .
      args:
        APP_ENV: production
    network_mode: host
    env_file:
      - .env.production
    environment:
      - APP_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
